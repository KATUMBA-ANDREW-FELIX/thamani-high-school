services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thamani_app
    restart: always
    ports:
      - "8080:80"
    volumes:
      - uploads_data:/var/www/html/uploads
      - calendar_docs_data:/var/www/html/calendar_docs
      - gallery_images_data:/var/www/html/gallery_images
      - library_data:/var/www/html/library
    env_file:
      - path: .env
        required: false
    environment:
      - DB_CONNECTION=pgsql
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-thamani_postgress}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
      - CLOUDINARY_UPLOAD_PRESET=${CLOUDINARY_UPLOAD_PRESET:-}
      - EGO_SMS_API_URL=${EGO_SMS_API_URL:-https://comms.egosms.co/api/v1/json/}
      - EGO_SMS_USERNAME=${EGO_SMS_USERNAME:-}
      - EGO_SMS_PASSWORD=${EGO_SMS_PASSWORD:-}
      - YO_PAYMENTS_MODE=${YO_PAYMENTS_MODE:-production}
      - YO_PAYMENTS_API_USERNAME=${YO_PAYMENTS_API_USERNAME:-}
      - YO_PAYMENTS_API_PASSWORD=${YO_PAYMENTS_API_PASSWORD:-}
      - YO_PAYMENTS_MOCK=${YO_PAYMENTS_MOCK:-}
      - SMS_UNIT_PRICE_UGX=${SMS_UNIT_PRICE_UGX:-50}
      - BITLINK_COLLECTION_FEE_PERCENT=${BITLINK_COLLECTION_FEE_PERCENT:-4.0}
      - THAMANI_RECEIPT_EMAIL=${THAMANI_RECEIPT_EMAIL:-info@thamani.ac.ug}
      - BITLINK_RECEIPT_FROM_EMAIL=${BITLINK_RECEIPT_FROM_EMAIL:-info@thamani.ac.ug}
      - BITLINK_RECEIPT_FROM_NAME=${BITLINK_RECEIPT_FROM_NAME:-bitlink pay}
      - BITLINK_SUPPORT_PHONE=${BITLINK_SUPPORT_PHONE:-0700126209}
      - BITLINK_SUPPORT_EMAIL=${BITLINK_SUPPORT_EMAIL:-felxkatumba4@gmail.com}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL:-info@thamani.ac.ug}
    depends_on:
      - db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.thamani.rule=Host(`thamaniacademy.work.gd`)"
      - "traefik.http.routers.thamani.entrypoints=web,websecure"
      - "traefik.http.routers.thamani.tls=true"
      - "traefik.http.routers.thamani.tls.certresolver=letsencrypt"
      - "traefik.http.services.thamani.loadbalancer.server.port=80"
      - "traefik.docker.network=${PROXY_NETWORK:-proxy}"
    networks:
      - thamani_net
      - proxy

  db:
    image: postgres:15-alpine
    container_name: thamani_postgres
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-thamani_postgress}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema_pg.sql:/docker-entrypoint-initdb.d/schema_pg.sql
    networks:
      - thamani_net

networks:
  thamani_net:
    driver: bridge
  proxy:
    name: ${PROXY_NETWORK:-proxy}
    external: true

volumes:
  uploads_data:
    driver: local
  calendar_docs_data:
    driver: local
  gallery_images_data:
    driver: local
  library_data:
    driver: local
  pgdata:
    driver: local
