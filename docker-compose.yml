services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thamani_app
    restart: always
    ports:
      - "8080:80"
    volumes:
      - uploads_data:/var/www/html/uploads
      - calendar_docs_data:/var/www/html/calendar_docs
      - gallery_images_data:/var/www/html/gallery_images
      - library_data:/var/www/html/library
    env_file:
      - path: .env
        required: false
    environment:
      - DB_CONNECTION=pgsql
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-thamani_postgress}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
      - CLOUDINARY_UPLOAD_PRESET=${CLOUDINARY_UPLOAD_PRESET:-}
    depends_on:
      - db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.thamani.rule=Host(`thamaniacademy.work.gd`)"
      - "traefik.http.routers.thamani.entrypoints=web,websecure"
      - "traefik.http.routers.thamani.tls=true"
      - "traefik.http.routers.thamani.tls.certresolver=letsencrypt"
      - "traefik.http.services.thamani.loadbalancer.server.port=80"
      - "traefik.docker.network=${PROXY_NETWORK:-proxy}"
    networks:
      - thamani_net
      - proxy

  db:
    image: postgres:15-alpine
    container_name: thamani_postgres
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-thamani_postgress}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema_pg.sql:/docker-entrypoint-initdb.d/schema_pg.sql
    networks:
      - thamani_net

networks:
  thamani_net:
    driver: bridge
  proxy:
    name: ${PROXY_NETWORK:-proxy}
    external: true

volumes:
  uploads_data:
    driver: local
  calendar_docs_data:
    driver: local
  gallery_images_data:
    driver: local
  library_data:
    driver: local
  pgdata:
    driver: local
