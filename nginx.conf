# Nginx Virtual Host Configuration for Thamani High School
# Domain: thamaniacademy.work.gd

server {
    listen 80;
    server_name thamaniacademy.work.gd www.thamaniacademy.work.gd;

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name thamaniacademy.work.gd www.thamaniacademy.work.gd;

    # SSL Certificates (managed via Certbot or Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/thamaniacademy.work.gd/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/thamaniacademy.work.gd/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # File upload limits for calendar documents and photos
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for heavy uploads
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        send_timeout 600;
    }

    # Static assets caching optimization
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    error_log /var/log/nginx/thamani_error.log;
    access_log /var/log/nginx/thamani_access.log;
}
