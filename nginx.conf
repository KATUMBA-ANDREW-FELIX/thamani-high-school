# Nginx Virtual Host Configuration for Thamani High School (High Performance & Caching)
# Domain: thamaniacademy.work.gd

server {
    listen 80;
    server_name thamaniacademy.work.gd www.thamaniacademy.work.gd;

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name thamaniacademy.work.gd www.thamaniacademy.work.gd;

    # SSL Protocols & Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Performance Tuning: Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # File upload limits
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep-Alive connection reuse
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Timeouts for heavy uploads
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        send_timeout 600;
    }

    # Static assets caching optimization with immutable Cache-Control
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, no-transform, max-age=31536000, immutable";
    }

    error_log /var/log/nginx/thamani_error.log;
    access_log /var/log/nginx/thamani_access.log;
}
