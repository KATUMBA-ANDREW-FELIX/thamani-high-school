services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thamani_app_local
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - uploads_local:/var/www/html/uploads
      - calendar_docs_local:/var/www/html/calendar_docs
      - gallery_images_local:/var/www/html/gallery_images
      - library_local:/var/www/html/library
    env_file:
      - path: .env
        required: false
    environment:
      - DB_CONNECTION=pgsql
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-thamani_postgress}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
      - CLOUDINARY_UPLOAD_PRESET=${CLOUDINARY_UPLOAD_PRESET:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - thamani_local

  db:
    image: postgres:15-alpine
    container_name: thamani_postgres_local
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-thamani_postgress}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - pgdata_local:/var/lib/postgresql/data
      - ./schema_pg.sql:/docker-entrypoint-initdb.d/schema_pg.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-thamani_postgress}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - thamani_local

networks:
  thamani_local:
    driver: bridge

volumes:
  uploads_local:
    driver: local
  calendar_docs_local:
    driver: local
  gallery_images_local:
    driver: local
  library_local:
    driver: local
  pgdata_local:
    driver: local
