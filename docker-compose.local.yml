services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thamani_app_local
    restart: unless-stopped
    ports:
      - "8080:80"
    env_file:
      - .env
    environment:
      - DB_CONNECTION=pgsql
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-thamani_postgress}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ThamaniPostgres2026!}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-thamaniacademy}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-555989584672519}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-dcmq5dQZfmysvewtwrAZTsCeI3w}
      - CLOUDINARY_UPLOAD_PRESET=${CLOUDINARY_UPLOAD_PRESET:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - thamani_local

  db:
    image: postgres:15-alpine
    container_name: thamani_postgres_local
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-thamani_postgress}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ThamaniPostgres2026!}
    ports:
      - "5433:5432"
    volumes:
      - pgdata_local:/var/lib/postgresql/data
      - ./schema_pg.sql:/docker-entrypoint-initdb.d/schema_pg.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-thamani_postgress}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - thamani_local

networks:
  thamani_local:
    driver: bridge

volumes:
  pgdata_local:
    driver: local
